version: '3.8'

services:
  # 1. Database Tier
  postgres-db:
    image: postgres:15-alpine
    container_name: autovapt_postgres
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: autovapt_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Backend Logic API Gateway
  backend-api:
    build: .
    container_name: autovapt_backend
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 80
    volumes:
      - .:/app
    ports:
      - "8000:80"
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: autovapt_db
      DATABASE_URL: postgresql://myuser:mypassword@postgres-db:5432/autovapt_db
    depends_on:
      - postgres-db

  # 3. Frontend Dashboard Presentation
  frontend-dashboard:
    build: .
    container_name: autovapt_frontend
    restart: always
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend-api:80
    depends_on:
      - backend-api

volumes:
  postgres_data: